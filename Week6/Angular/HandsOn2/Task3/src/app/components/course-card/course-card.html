<article class="course-card">
  <div class="course-id">
    Course ID: {{ course.id }}
  </div>

  <h2>{{ course.name }}</h2>

  <p>
    <strong>Course Code:</strong>
    {{ course.code }}
  </p>

  <p>
    <strong>Credits:</strong>
    {{ course.credits }}
  </p>

  <button
    type="button"
    (click)="requestEnrollment()">
    Enroll
  </button>
</article>
