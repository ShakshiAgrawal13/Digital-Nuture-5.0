<article class="course-card">
  <span class="course-code">
    {{ course.code }}
  </span>

  <h2>{{ course.name }}</h2>

  <p>
    <strong>Course ID:</strong>
    {{ course.id }}
  </p>

  <p>
    <strong>Credits:</strong>
    {{ course.credits | creditLabel }}
  </p>

  <p>
    <strong>Instructor:</strong>
    {{ course.instructor }}
  </p>

  <p class="description">
    {{ course.description }}
  </p>
</article>
