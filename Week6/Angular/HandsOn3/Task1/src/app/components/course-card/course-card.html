<article class="course-card">
  <div class="course-number">
    Course ID: {{ course.id }}
  </div>

  <h2>{{ course.name }}</h2>

  <p>
    <strong>Course Code:</strong>
    {{ course.code }}
  </p>

  <p>
    <strong>Credits:</strong>
    {{ course.credits }}
  </p>

  <div [ngSwitch]="course.gradeStatus">
    <span
      *ngSwitchCase="'passed'"
      class="badge badge-passed">
      Passed
    </span>

    <span
      *ngSwitchCase="'failed'"
      class="badge badge-failed">
      Failed
    </span>

    <span
      *ngSwitchCase="'pending'"
      class="badge badge-pending">
      Pending
    </span>

    <span
      *ngSwitchDefault
      class="badge badge-pending">
      Status Unknown
    </span>
  </div>
</article>
